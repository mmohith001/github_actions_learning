name: adding-test-workflow
on: push
jobs:
 test-job:
  runs-on: ubuntu-latest
  steps:
   - name: checking out git code
     uses: actions/checkout@v3
   - name: installing npm
     uses: actions/setup-node@v6
     with:
       node-version: 18
   - name: installing dependencies
     run: npm ci
   - name: running tests
     run: npm test

    